name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify dist/ artifact layout
        run: |
          test -f dist/avatar.js
          test -f dist/icons.js
          test -f dist/composables.js
          test -f dist/lib.js
          test -f dist/spora-components.css
          test -d dist/types
      - name: publint
        run: npm run lint:pkg
      # Every exports target must survive the `files` filter. publint
      # reads the working tree, so it cannot catch a target that builds
      # fine locally but is absent from the published tarball.
      - name: Verify exports targets survive packing
        run: node scripts/verify-exports.mjs
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
