name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Verify dist/ artifact layout
        run: |
          test -f dist/avatar.js
          test -f dist/icons.js
          test -f dist/composables.js
          test -f dist/lib.js
          test -f dist/spora-components.css
          test -d dist/types
      # Catches an exports entry pointing at a file the build does not
      # emit, or a subpath whose stylesheet is unreachable — the defect
      # that shipped unstyled components to consumers once already.
      - name: publint
        run: npx --yes publint@latest --strict
      - name: Verify every exports target resolves in the packed tarball
        run: |
          npx --yes @arethetypeswrong/cli@latest --pack .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
