# SonarQube project configuration for spora-ai/spora-components
# Mirrors spora-frontend's sonar-project.properties but trimmed for a
# library (no Composer/PHP artefacts — Vue + TS only).
sonar.projectKey=spora-ai_SporaComponents
sonar.projectName=spora-components
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.tests=tests
sonar.exclusions=dist/**,node_modules/**,coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.json
