sonar.organization=spora-ai
sonar.projectKey=spora-ai_spora-components
sonar.projectName=spora-components
sonar.projectVersion=0.1.0

sonar.sources=src,scripts
sonar.tests=tests
sonar.exclusions=dist/**,node_modules/**,coverage/**

sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.json

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.test.inclusions=tests/**/*.{test,spec}.{ts,js}

sonar.coverage.exclusions=tests/**,src/types/**,scripts/**,*.config.{js,ts,mjs}
sonar.cpd.exclusions=src/**/*.{vue,ts}

sonar.pullrequest.provider=GitHub
sonar.pullrequest.github.repository=spora-ai/spora-components
